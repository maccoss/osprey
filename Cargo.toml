[workspace]
resolver = "2"
members = [
    "crates/osprey-core",
    "crates/osprey-io",
    "crates/osprey-chromatography",
    "crates/osprey-scoring",
    "crates/osprey-fdr",
    "crates/osprey-ml",
    "crates/osprey",
]

[workspace.package]
version = "26.6.1"
edition = "2021"
rust-version = "1.75"
license = "LGPL-3.0-only"
repository = "https://github.com/maccoss/osprey"
authors = ["MacCoss Lab <maccoss@uw.edu>"]
description = "Peptide-centric DIA analysis tool"

[workspace.dependencies]
# Internal crates
osprey-core = { path = "crates/osprey-core" }
osprey-io = { path = "crates/osprey-io" }
osprey-chromatography = { path = "crates/osprey-chromatography" }
osprey-scoring = { path = "crates/osprey-scoring" }
osprey-fdr = { path = "crates/osprey-fdr" }
osprey-ml = { path = "crates/osprey-ml" }

# Core dependencies
ndarray = { version = "0.17", features = ["rayon", "blas"] }
blas-src = { version = "0.14", default-features = false, features = ["openblas"] }
openblas-src = { version = "0.10", default-features = false, features = ["system", "cblas"] }
rayon = "1.10"
arrow = "58"
parquet = "58"

# File I/O
mzdata = "0.63"
# Used by osprey-io::mzml to pre-parse isolation-window cvParams as
# f64, bypassing mzdata 0.63's `param.to_f32()` quantization which
# produces ~3e-5 m/z drift on isolation bounds that land between two
# f32-representable values. mzdata transitively pins quick-xml 0.30,
# so this version matches and does not bloat the dep graph.
quick-xml = "0.30"
rusqlite = { version = "0.39", features = ["bundled"] }
csv = "1.3"
# Use flate2's `zlib-default` feature (vendored stock zlib via libz-sys)
# rather than the default `miniz_oxide` Rust backend. zlib-default
# produces deflate output bit-compatible with Skyline's existing
# BlibData writer (DotNetZip / Ionic.Zlib level 6 — see
# pwiz/pwiz_tools/Skyline/Util/Extensions/UtilDB.cs:109-200) AND with
# pwiz_tools/BiblioSpec C++ (which uses stock zlib). Without this,
# miniz_oxide leaves a small handful of byte-level blob mismatches
# (~20 on Stellar 3-file) on .blib RefSpectraPeaks vs the C# /
# Skyline standard. ProteoWizard owns the BLIB format spec so the
# convergence point is C# / Skyline / Ionic.Zlib level 6, not the
# Rust default backend.
flate2 = { version = "1.0", default-features = false, features = ["zlib-default"] }
base64 = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` is essential: without it, serde_json's default
# f64 parser is best-effort and loses 1 ULP on some shortest-roundtrip
# strings (e.g., "3.1575921556296254" → bits 0x...877 with std parse,
# 0x...878 with serde_json default). The Stage 5 → Stage 6 boundary
# files round-trip f64 calibration arrays through this parser, so the
# bug shows up as a silent 1-ULP drift in the rehydrated calibration.
serde_json = { version = "1.0", features = ["raw_value", "float_roundtrip"] }
serde_yaml = "0.9"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Utilities
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
indicatif = "0.18"
chrono = "0.4"
sha2 = "0.10"
sysinfo = "0.38"

# Testing
approx = "0.5"
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"
debug = true
